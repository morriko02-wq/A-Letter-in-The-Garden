
name: Build and Deploy Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir build-source
          unzip -q a-letter-in-the-garden.zip -d build-source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build-source/vite.config.ts")
          s = p.read_text()
          s = s.replace(
              "return {",
              "return {\n    base: '/A-Letter-in-The-Garden/',",
              1
          )
          p.write_text(s)
          PY

      - name: Install and build
        working-directory: build-source
        run: |
          npm install
          npm run build

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-source/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
